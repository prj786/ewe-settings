<!doctype html>
<!-- Browser-only harness: fakes the Tauri bridge so panes can be eyeballed
     without a compositor. Never shipped (dev server only); delete freely.
     Open http://localhost:5174/dev-mock.html

     Query parameters (all optional):
       scheme=ewe-dark|ewe-light|kanagawa|a11y   which theme_tokens reply to serve
       pane=<nav label>                          open that section ("Networking")
       click=<css selector>                      click that element (open a sheet)
       focus=<css selector>                      keyboard-focus that element
       sync=conflict                             User: the account's copy changed (conflict)
       shell=down                                the shell answers nothing
       addons=fresh|dock|legacy                  fresh (default): no dock, two bar
                                                 widgets; dock: ewe.dock on too;
                                                 legacy: an ewe before opt-in plugins
       find=<words>                              type that into Find a setting
       open=1                                    …and open the first result
       glass=<0-100>                             the bar opacity (100 = Glass off)
     Every invoke is logged in window.__calls ([cmd, args]), so a test can
     assert that just viewing a page writes nothing (set_conf, write_*);
     ?calls appends them to the page as <pre id="calls"> for --dump-dom.
     Fonts: copy ewe/design/system/fonts/*.woff2 into .dev-mock/fonts/ and
     the page uses Geist like the real app.
     The theme replies are real `ewe-theme show` / `scheme list|show` output,
     generated into .dev-mock/ (git-ignored) from an isolated XDG_CONFIG_HOME;
     without them the compiled tokens.css (Ewe Dark) stands. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ewe Settings (mock)</title>
    <script>
      const q = new URLSearchParams(location.search);
      const scheme = q.get("scheme") || "ewe-dark";
      const listSlug = scheme === "a11y" ? "ewe-dark" : scheme;
      const json = (p) => fetch(p).then((r) => (r.ok ? r.json() : Promise.reject(p)));
      const mon = (name, w, h, x, y, scale, desc) => ({
        name, description: desc, width: w, height: h, refreshRate: 120,
        x, y, scale, transform: 0, vrr: false, currentFormat: "XRGB8888",
        disabled: false, mirrorOf: "none",
        availableModes: [w + "x" + h + "@120.00Hz", w + "x" + h + "@60.00Hz", "1920x1080@60.00Hz"]
      });
      window.__calls = [];
      document.write(`<style>
        @font-face { font-family: "Geist"; src: url("/.dev-mock/fonts/Geist-Variable.woff2") format("woff2"); font-weight: 100 900; }
        @font-face { font-family: "Geist Mono"; src: url("/.dev-mock/fonts/GeistMono-Variable.woff2") format("woff2"); font-weight: 100 900; }
      </style>`);
      const glass = q.get("glass");
      const withGlass = (t) => (glass && t && t.input ? { ...t, input: { ...t.input, bar_opacity: Number(glass) } } : t);
      window.__TAURI_INTERNALS__ = {
        transformCallback: (cb) => cb,
        metadata: { currentWindow: { label: "main" }, currentWebview: { label: "main" } },
        invoke: (cmd, args) => {
          window.__calls.push([cmd, args]);
          switch (cmd) {
            case "hyprctl_query":
              if (args && args.args && args.args[0] === "devices") return Promise.resolve(JSON.stringify({ mice: [{ name: "logitech-mx-master-3" }, { name: "elan-touchpad" }] }));
              if (args && args.args && args.args[0] === "--batch") return Promise.resolve("");
              return Promise.resolve(JSON.stringify([
                mon("eDP-1", 2880, 1800, 0, 0, 2, "BOE NE160QDM"),
                mon("DP-1", 2560, 1440, 1440, 0, 1, "Dell U2724D")
              ]));
            case "read_config":
              if (args.rel === "hypr/SHORTCUTS.md") return Promise.resolve("## Windows\n| Super + Q | Close the window |\n| Super + F | Fullscreen |\n## Workspaces\n| Super + 1 … 9 | Go to a workspace |\n| Super + Shift + 1 … 9 | Move the window there |");
              return Promise.resolve("");
            case "read_prefs": return Promise.resolve({ accent: "#eeb407", tintBorders: true, eventSounds: true });
            case "write_prefs": return Promise.resolve({ accent: "#eeb407" });
            case "vrr_caps": return Promise.resolve({ "eDP-1": false, "DP-1": true });
            case "shell_version": return Promise.resolve("0.21.2-beta");
            case "shell_running": return Promise.resolve(q.get("shell") !== "down");
            case "sync_app_installed": return Promise.resolve(true);
            // the shell's account snapshot (`qs ipc call cloud status`):
            // ?sync=conflict shows the refused-push state, ?shell=down none at all
            case "qs_ipc": {
              if (q.get("shell") === "down") return Promise.reject("the shell did not answer");
              if (args.target === "cloud" && args.func === "status") return Promise.resolve(JSON.stringify({
                probed: true, signedIn: true, displayName: "Nino", user: "nino", email: "nino@example.org",
                serverHost: "cloud.example.org", quota: { used: 62474867, total: 8589934592 },
                syncState: q.get("sync") === "conflict" ? "error" : "idle", syncConflict: q.get("sync") === "conflict",
                syncError: q.get("sync") === "conflict" ? "The copy in your account was saved by this computer but is not the one it last synced — push anyway to replace it, or restore it. Open ewe-sync to decide." : "",
                inSync: q.get("sync") !== "conflict", lastSync: "2026-10-10T09:00:00Z", localSyncedAt: "2026-10-10T09:00:00Z",
                autoSync: true, remoteMachine: "emoh", remoteModified: "2026-10-10T09:00:00Z", filesMounted: true, filesPath: "~/Nextcloud", calState: "ok", eventCount: 3 }));
              return Promise.resolve("");
            }
            case "user_info": return Promise.resolve({ user: "mock", host: "ewe", realName: "Nino Beridze", uptime: "3 h 12 min" });
            case "theme_tokens": return json(`/.dev-mock/theme-${scheme}.json`).then(withGlass);
            case "theme_scheme": {
              const verb = args.args[0];
              if (verb === "list") return json(`/.dev-mock/list-${listSlug}.json`);
              if (verb === "show") return json(`/.dev-mock/show-${args.args[1]}.json`);
              return Promise.resolve({ ok: true });
            }
            case "blur_available": return Promise.resolve(q.get("blur") !== "0");
            case "set_conf": return Promise.resolve(null);
            // ewe-plugin list --json, as src-tauri/src/addons.rs shapes it
            case "addons_state": {
              const mode = q.get("addons") || "fresh";
              if (mode === "legacy") return Promise.resolve({ legacy: true, why: "mock: ewe-plugin predates opt-in plugins", installed: {}, plugins: [], available: [], removed: [] });
              const plugins = [
                { id: "ewe.clipboard", name: "Clipboard & emoji", description: "Clipboard history and an emoji picker under a scissors icon in the bar; records copies, never passwords.", kinds: ["bar-widget", "panel", "service"], barWidget: { defaultSection: "right" }, enabled: true, valid: true },
                { id: "ewe.sysmon", name: "System monitor", description: "CPU and memory meters in Quick settings; this shows them in the bar too.", kinds: ["quick-tile", "bar-widget"], barWidget: { defaultSection: "right" }, enabled: true, valid: true },
                { id: "ewe.insomnia", name: "Insomnia", description: "Keeps the screen on.", kinds: ["service", "quick-tile", "bar-status"], barWidget: null, enabled: true, valid: true }
              ];
              if (mode === "dock") plugins.push({ id: "ewe.dock", name: "Dock", description: "Pinned apps, the launcher and your workspaces at the bottom.", kinds: ["panel", "service"], barWidget: null, enabled: true, valid: true });
              const have = new Set(plugins.map((p) => p.id));
              const catalog = [
                ["ewe.dock", "Dock", "Pinned apps, the launcher and your workspaces at the bottom.", "icDock"],
                ["ewe.media", "Music", "What's playing, with controls.", "icMusic"],
                ["ewe.places", "Places", "Your folders, drives and the Trash.", "icFolder"],
                ["ewe.phone", "Phone", "Your phone's notifications, battery and messages (KDE Connect).", "icPhone"],
                ["ewe.mail", "Mail", "Unread mail in the bar and Quick settings.", "icMail"],
                ["ewe.cast", "Cast to TV", "Mirror the screen to a Miracast TV.", "icCast"],
                ["ewe.vpn", "VPN", "A tile and a page for your VPNs.", "icShield"],
                ["ewe.ssh", "SSH", "Hosts, tunnels and scripts.", "icTerminal"],
                ["ewe.sysmon", "System monitor", "CPU and memory meters.", "icGauge"],
                ["ewe.insomnia", "Insomnia", "Keeps the screen on.", "icEye"],
                ["ewe.clipboard", "Clipboard & emoji", "Clipboard history and an emoji picker.", "icScissors"],
                ["ewe.screenshot", "Screenshot", "A camera in the bar and the Print keys.", "icCamera"],
                ["ewe.passwords", "Passwords", "Fill a login from your password manager.", "icKey"]
              ].map(([id, name, description, icon]) => ({ id, name, description, icon, version: "0.1.0", kinds: [], installed: have.has(id), enabled: have.has(id), requires: { packages: [], commands: [] }, missing: { packages: [], commands: [] } }));
              return Promise.resolve({ legacy: false, installed: Object.fromEntries(plugins.map((p) => [p.id, p.enabled])), plugins, available: catalog, removed: [] });
            }
            case "open_addons": return Promise.resolve(q.get("komble") !== "0");
            case "net_status": return Promise.resolve({
              hasWifi: true, wifiOn: true,
              wired: { dev: "enp3s0", state: "unavailable" },
              wifi: [
                { ssid: "office", signal: 82, sec: "WPA2", active: true },
                { ssid: "Cafe Guest", signal: 55, sec: "", active: false },
                { ssid: "ნინოს ქსელი", signal: 30, sec: "WPA3", active: false }
              ],
              saved: { office: { name: "office", psk: "stored" } },
              active: [{ name: "office", type: "802-11-wireless", dev: "wlan0", state: "activated" }],
              ips: ["192.168.1.24/24"],
              vpn: [{ name: "Work", active: false }],
              sshHosts: ["build-box"]
            });
            case "bt_status": return Promise.resolve({
              adapter: { powered: true, discoverable: false, discovering: false, alias: "ewe" },
              devices: [
                { address: "AA:BB", name: "WH-1000XM5", icon: "audio-headset", paired: true, connected: true, trusted: true, battery: 80 },
                { address: "CC:DD", name: "MX Keys", icon: "input-keyboard", paired: true, connected: false, trusted: true },
                { address: "EE:FF", name: "Pixel 9", icon: "phone", paired: false, connected: false, rssi: -61 }
              ]
            });
            case "diagnostics": return Promise.resolve({ hypr: "0.57.0", hypr_raw: "Hyprland 0.57.0 built from branch v0.57.0 at commit 0aa6745f clean", kernel: "7.2.11-arch1-1", gpu: "amdgpu", mem: "12.0 GB of 30.8 GB in use", disk: "254 GB of 953 GB used", gsession: "active", portal: "active", portal_hypr: "active", portal_gtk: "inactive", browser: "helium.desktop", hypridle: "yes" });
            // Default apps: what xdg-mime / gio answer, and the names behind the ids
            case "mime_default": return Promise.resolve({ "x-scheme-handler/https": "helium.desktop", "x-scheme-handler/mailto": "", "text/plain": "dev.zed.Zed.desktop", "image/png": "org.gnome.Loupe.desktop", "video/mp4": "mpv.desktop", "inode/directory": "org.gnome.Nautilus.desktop" }[args.mime] ?? "");
            case "mime_apps": return Promise.resolve({ "x-scheme-handler/https": ["helium.desktop", "zen.desktop", "kitty-open.desktop"], "x-scheme-handler/mailto": [], "text/plain": ["dev.zed.Zed.desktop", "org.gnome.TextEditor.desktop"], "image/png": ["org.gnome.Loupe.desktop", "helium.desktop"], "video/mp4": ["mpv.desktop", "vlc.desktop"], "inode/directory": ["org.gnome.Nautilus.desktop"] }[args.mime] ?? []);
            case "app_names": return Promise.resolve(Object.fromEntries(Object.entries({ "helium.desktop": "Helium", "zen.desktop": "Zen Browser", "kitty-open.desktop": "kitty URL Launcher", "dev.zed.Zed.desktop": "Zed", "org.gnome.TextEditor.desktop": "Text Editor", "org.gnome.Loupe.desktop": "Image Viewer", "mpv.desktop": "mpv Media Player", "vlc.desktop": "VLC media player", "org.gnome.Nautilus.desktop": "Files" }).filter(([k]) => args.ids.includes(k))));
            case "power_info": return Promise.resolve({ battery: { capacity: 84, status: "Discharging", health: 0.91, cycles: 212, chargeLimit: 80, chargeLimitWritable: true }, kbdBacklight: { present: true, value: 1, max: 3 }, profiles: ["power-saver", "balanced", "performance"], profile: "balanced" });
            case "default_wallpaper_dir": return Promise.resolve("/usr/share/ewe/system/branding/wallpapers");
            case "list_wallpapers": return Promise.resolve([]);
            case "wallpaper_backend": return Promise.resolve("img=awww video=mpvpaper");
            case "time_info": return Promise.resolve({ timezone: "Asia/Tbilisi", auto: true, ntp: true, ntpSynced: true });
            case "list_timezones": return Promise.resolve(["Asia/Tbilisi", "Asia/Tokyo", "Europe/Berlin", "Europe/London", "America/New_York"]);
            case "locale_info": return Promise.resolve({ current: "en_US.UTF-8", currentLabel: "English (United States)", generated: true, choices: [{ code: "en_US.UTF-8", label: "English (United States)", generated: true }, { code: "ka_GE.UTF-8", label: "Georgian (Georgia)", generated: false }, { code: "de_DE.UTF-8", label: "German (Germany)", generated: true }] });
            case "hostname_get": return Promise.resolve("ewe-laptop");
            case "net_connections": return Promise.resolve([{ uuid: "1", name: "office", type: "802-11-wireless", active: true, dev: "wlan0" }, { uuid: "2", name: "Home", type: "802-11-wireless", active: false }]);
            case "desktop_apps": return Promise.resolve([{ id: "helium", name: "Helium", exec: "helium %U", icon: "helium", comment: "Web browser" }, { id: "kitty", name: "kitty", exec: "kitty", icon: "kitty", comment: "Terminal" }, { id: "org.gnome.Nautilus", name: "Files", exec: "nautilus", icon: "files", comment: "Your files" }]);
            default: return Promise.resolve("");
          }
        }
      };
      // headless screenshots freeze CSS transitions mid-way; ?still turns them off
      if (q.has("still")) document.write("<style>*,*::before,*::after{transition:none!important;animation:none!important}</style>");
      // open a section and focus an element once the app is up
      addEventListener("load", () => {
        const pane = q.get("pane");
        const focus = q.get("focus");
        setTimeout(() => {
          if (pane) document.querySelector(`.ewe-navitem[title="${pane}"]`)?.click();
          const find = q.get("find");
          if (find) {
            const f = document.querySelector(".nav-search input");
            f.focus();
            f.value = find;
            f.dispatchEvent(new Event("input", { bubbles: true }));
            if (q.get("open")) setTimeout(() => f.dispatchEvent(new KeyboardEvent("keydown", { key: "Enter", bubbles: true })), 50);
          }
          // ?calls: after the page settles, list every command it ran
          if (q.has("calls")) setTimeout(() => {
            const pre = document.createElement("pre");
            pre.id = "calls";
            pre.textContent = JSON.stringify(window.__calls.map(([c, a]) => (c === "theme_scheme" ? `${c} ${a.args[0]}` : c)));
            document.body.append(pre);
          }, 2500);
          setTimeout(() => {
            if (q.get("click")) document.querySelector(q.get("click"))?.click();
            if (focus) document.querySelector(focus)?.focus();
          }, 400);
        }, 300);
      });
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
