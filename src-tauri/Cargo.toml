[package]
name = "ewe-settings"
version = "0.27.0-beta"
description = "Settings for the ewe desktop"
authors = ["scubba"]
license = "MIT"
edition = "2021"

[lib]
name = "ewe_settings_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-shell = "2"
# Open/Save through the portal, so ewe's file picker draws it (ewe RFC-011);
# the default "gtk3" feature drew GTK's dialog inside this app instead
tauri-plugin-dialog = { version = "2", default-features = false, features = ["xdg-portal"] }
tauri-plugin-fs = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-os = "2"
tauri-plugin-opener = "2"
# the web view's leave event (pointer.rs); the gtk that Tauri itself uses
gtk = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
thiserror = "2"

[features]
default = []

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"
